name: PR Verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERIFY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Select verification plan
        id: plan
        shell: pwsh
        run: node scripts/verify-change.mjs --base $env:VERIFY_BASE --head HEAD --plan --github-output $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        if: steps.plan.outputs.runtime == 'true'
        with:
          python-version: "3.11"

      - name: Prepare code verification dependencies
        if: steps.plan.outputs.runtime == 'true'
        shell: pwsh
        run: |
          corepack enable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          corepack prepare pnpm@10.11.0 --activate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install "./services/sidecar[dev]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify change
        shell: pwsh
        run: node scripts/verify-change.mjs --base $env:VERIFY_BASE --head HEAD

      - uses: dtolnay/rust-toolchain@stable
        if: github.ref == 'refs/heads/main' && steps.plan.outputs.runtime == 'true'

      - name: Restore shared release Rust cache
        if: github.ref == 'refs/heads/main' && steps.plan.outputs.runtime == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: typedance-windows-release
          workspaces: apps/desktop/src-tauri -> target
          cache-on-failure: true

      - name: Test native release profile and warm default-branch cache
        if: github.ref == 'refs/heads/main' && steps.plan.outputs.runtime == 'true'
        shell: pwsh
        env:
          TYPEDANCE_UPDATE_REPOSITORY: ${{ vars.TYPEDANCE_UPDATE_REPOSITORY }}
        run: pnpm release:rust-test
