[project]
name = "typedance-sidecar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.7.0",
  "uvicorn>=0.30.0",
  "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "httpx>=0.27.0", "pytest-mock>=3.14.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
