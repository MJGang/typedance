[project]
name = "typedance-sidecar"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "langchain>=1.3.1",
  "langchain-openai>=1.2.2",
  "langgraph>=1.2.1",
  "pydantic>=2.7.0",
  "python-multipart>=0.0.29",
  "sharepoint-to-text>=1.1.11",
  "uvicorn>=0.30.0",
  "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "httpx>=0.27.0", "pytest-mock>=3.14.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
